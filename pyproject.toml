[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-cube-mcp"
version = "0.4.2"
description = "MCP server 封装 STM32CubeMX 命令行,通过 MCP 工具配置引脚/外设并生成 HAL 工程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "F1ZyCaO_3286" },
    { name = "F1ZyCaO_3286", email = "3286266250@qq.com" },
]
keywords = ["mcp", "stm32", "stm32cubemx", "embedded", "hal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
vscode-cube-mcp = "cubemx_mcp:main"

[tool.setuptools]
py-modules = ["cubemx_mcp"]

[tool.setuptools.data-files]
# templates/ 模板库必须随包分发(cubemx_new_project 依赖它)
"templates" = [
    "templates/STM32F103C8T6.ioc",
]

[tool.pytest.ini_options]
# 覆盖率门槛:核心逻辑 <80% 视为失败(本地与 CI 同一配置)
addopts = "--cov=cubemx_mcp --cov-report=term-missing --cov-fail-under=80"
testpaths = ["test_cubemx_mcp.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 保守集:错误级(E4/E7/E9/F)+ 导入排序(I)+ pyupgrade(UP);设计性项(BLE/S110/PIE 等)不启用
select = ["E4", "E7", "E9", "F", "I", "UP"]