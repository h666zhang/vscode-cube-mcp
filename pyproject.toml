[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-cube-mcp"
version = "0.2.1"
description = "MCP server 封装 STM32CubeMX 命令行,通过 MCP 工具配置引脚/外设并生成 HAL 工程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "F1ZyCaO_3286", email = "3286266250@qq.com" }]
keywords = ["mcp", "stm32", "stm32cubemx", "embedded", "hal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
vscode-cube-mcp = "cubemx_mcp:main"

[tool.setuptools]
py-modules = ["cubemx_mcp"]

[tool.setuptools.data-files]
# templates/ 模板库必须随包分发(cubemx_new_project 依赖它)
"templates" = [
    "templates/README.md",
    "templates/STM32F103C8T6.ioc",
    "templates/STM32F103C8T6_tim_template.ioc",
    "templates/STM32F103C8T6_tim2_internal.ioc",
]