[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-cube-mcp"
version = "0.4.4.3"
description = "MCP server 封装 STM32CubeMX 命令行,通过 MCP 工具配置引脚/外设并生成 HAL 工程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "F1ZyCaO_3286" },
    { name = "F1ZyCaO_3286", email = "3286266250@qq.com" },
]
keywords = ["mcp", "stm32", "stm32cubemx", "embedded", "hal"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["mcp>=2.0.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/h666zhang/vscode-cube-mcp"
Repository = "https://github.com/h666zhang/vscode-cube-mcp"
Issues = "https://github.com/h666zhang/vscode-cube-mcp/issues"

[project.scripts]
vscode-cube-mcp = "vscode_cube_mcp.cubemx_mcp:main"

[tool.setuptools]
# src 布局:包在 src/vscode_cube_mcp/;templates/ 与 knowledge/ 仍是根目录下的 data-files(见下)
package-dir = { "" = "src" }
packages = ["vscode_cube_mcp"]

[tool.setuptools.data-files]
# templates/ 模板库必须随包分发(cubemx_new_project 依赖它)
"templates" = [
    "templates/STM32F103C8T6.ioc",
]
# AGENTS.md(agent 工作守则)随包分发到 site-packages 上级目录
"." = [
    "AGENTS.md",
]
# knowledge/ 知识库必须随包分发(cubemx_help / cubemx_intent 都依赖它)
# 注意:这里的 key 是"装到哪个目录",所以必须按子目录分别写 ——
# 全写成 "knowledge" 会把子目录展平(装完变成 knowledge/tim.yaml),
# 那样 knowledge_loader 就找不到 knowledge/rules/*.yaml 了。
"knowledge" = ["knowledge/meta.yaml"]
"knowledge/mcu" = ["knowledge/mcu/*.yaml"]
"knowledge/ip" = ["knowledge/ip/*.yaml"]
"knowledge/rules" = ["knowledge/rules/*.yaml"]

[tool.pytest.ini_options]
# src 布局:让测试无需先安装即可 import vscode_cube_mcp(本地与 CI 同一配置)
pythonpath = ["src"]
# 覆盖率门槛:核心逻辑 <80% 视为失败(本地与 CI 同一配置)
addopts = "--cov=vscode_cube_mcp --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 保守集:错误级(E4/E7/E9/F)+ 导入排序(I)+ pyupgrade(UP);设计性项(BLE/S110/PIE 等)不启用
select = ["E4", "E7", "E9", "F", "I", "UP"]