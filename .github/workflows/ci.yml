name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 可编辑安装:仓库依赖(pyyaml)与 pytest/pythonpath 配置都来自 pyproject.toml
          python -m pip install -e . pytest pytest-cov ruff
      - name: Lint with ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests with coverage gate (>=80%)
        # 测试为纯单元测试,不依赖 STM32CubeMX 实体
        run: python -m pytest

  # 最低依赖版本回归:上面的 matrix 装的是**最新**依赖,这里装**最低支持版本**。
  # 2026-10-12 加:当天 mcp 2.3 改了工具异常语义(只有抛 SDK 自己的 ToolError 才算"预期失败",
  # 其它异常按崩溃处理、原始消息被吞),而本地装的是 2.0.0 —— 典型的"本地绿、CI 红"。
  # 这个 job 把两端行为都锁住。
  test-min-deps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies (lowest supported mcp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff
          # 显式降级到最低支持版(mcp>=2.0.0),验证老 SDK 下的行为
          python -m pip install "mcp==2.0.0"
          python -m pip show mcp
      - name: Run tests (no coverage gate)
        run: python -m pytest -q --no-cov

  # 打包冒烟:上面几个 job 用的是 `pip install -e .`(可编辑安装),它**不会**暴露
  # "wheel 里少了 knowledge/ 或 templates/"这类打包问题 —— 那种只有真装一次才看得见。
  # 2026-10-15 加:发布前拦住"装完找不到知识库/模板"这种线上报障。
  test-wheel-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and install into a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv smoke
          .\smoke\Scripts\python.exe -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
      - name: Smoke test (knowledge/ 与 templates/ 是否随 wheel 装上)
        run: |
          .\smoke\Scripts\python.exe -c "import vscode_cube_mcp.cubemx_mcp as m, vscode_cube_mcp.knowledge_loader as k; print('knowledge:', k.knowledge_dir()); print('templates:', m._available_templates()); assert k.knowledge_dir().is_dir(), 'knowledge/ 没随 wheel 装上'; assert m._available_templates(), 'templates/ 没随 wheel 装上'; print('SMOKE OK')"
