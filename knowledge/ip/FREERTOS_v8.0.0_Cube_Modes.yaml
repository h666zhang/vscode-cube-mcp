    type: integer
    default: '25'
  RecursiveMutexesKeys:
    comment: Keys for config file
    type: string
    default: RecursiveMutexes01
  RecursiveMutexes01:
    comment: Recursive mutexes (1 to 25)
    type: string
  MaxBinarySemaphores:
    comment: Maximum number of binary semaphores
    type: integer
    default: '25'
  BinarySemaphoresKeys:
    comment: Keys for config file
    type: string
    default: BinarySemaphores01
  BinarySemaphores01:
    comment: Binary semaphores (1 to 25)
    type: string
  MaxCountingSemaphores:
