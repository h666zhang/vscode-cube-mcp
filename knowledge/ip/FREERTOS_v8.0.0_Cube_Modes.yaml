name: FREERTOS
version: v8.0.0_Cube
parameters:
  configUSE_NEWLIB_REENTRANT:
    comment: USE_NEWLIB_REENTRANT
    type: list
    default: '0'
    group: Newlib settings (see parameter description first)
    values:
    - '0'
    - '1'
  copyHeapFile:
    comment: Use FW pack heap file
    type: list
    default: '1'
    group: Project settings (see parameter description first)
    values:
    - '0'
    - '1'
  FreeRTOS_API:
    comment: FreeRTOS API
    type: uniqueElementList
    default: '2'
    group: API
    values:
    - '2'
    - '1'
    - '0'
  CMSIS_version:
    comment: CMSIS-RTOS version
    type: String
    default: '1.02'
    group: Versions
    values:
    - '1.02'
    - 2.1.3
    - '2.00'
    - undefined
  FREERTOS_version:
    comment: FreeRTOS version
    type: String
    default: 10.0.1
    group: Versions
    values:
    - 10.0.1
    - 10.3.1
    - 10.2.1
    - 10.6.2
  RAM_SIZE:
    comment: RAM_SIZE
    type: integer
    default: =$RamSize
  MAX_RAM_SIZE:
    comment: MAX RAM SIZE
    type: integer
    default: '2048'
  MAX_SIZE_IN_USE:
    comment: Max RAM size according to memory allocation
    type: integer
    default: =MAX_RAM_SIZE/4
  MIN_PRIO_IN_USE:
    comment: Min Prio used by freertos tasks (middleware ones and user ones)
    type: integer
    default: '1'
  configUSE_PREEMPTION:
    comment: USE_PREEMPTION
    type: list
    default: '1'
    group: Kernel settings
    values:
    - '0'
    - '1'
  configCPU_CLOCK_HZ:
    comment: CPU_CLOCK_HZ
    type: uniqueElementList
    default: SystemD2Clock
    group: Kernel settings
    values:
    - SystemD2Clock
    - SystemCoreClock
  configTICK_RATE_HZ:
    comment: TICK_RATE_HZ
    type: integer
    default: '1000'
    min: '1'
    max: '1000'
    group: Kernel settings
  configMAX_PRIORITIES:
    comment: MAX_PRIORITIES
    type: uniqueElementList
    default: '56'
    group: Kernel settings
    min: '4'
    max: '32'
  configUSE_SB_COMPLETED_CALLBACK:
    comment: USE_SB_COMPLETED_CALLBACK
    type: integer
    default: '0'
    min: '0'
    max: '1'
    group: Kernel settings
  configUSE_MINI_LIST_ITEM:
    comment: USE_MINI_LIST_ITEM
    type: integer
    default: '1'
    min: '0'
    max: '1'
    group: Kernel settings
  configMINIMAL_STACK_SIZE:
    comment: MINIMAL_STACK_SIZE
    type: integer
    default: '64'
    min: '48'
    max: =MAX_SIZE_IN_USE
    unit: Words
    group: Kernel settings
  configMAX_TASK_NAME_LEN:
    comment: MAX_TASK_NAME_LEN
    type: integer
    default: '16'
    min: '12'
    max: '255'
    group: Kernel settings
  configUSE_16_BIT_TICKS:
    comment: USE_16_BIT_TICKS
    type: uniqueElementList
    default: '0'
    group: Kernel settings
    values:
    - '0'
  configIDLE_SHOULD_YIELD:
    comment: IDLE_SHOULD_YIELD
    type: list
    default: '1'
    group: Kernel settings
    values:
    - '0'
    - '1'
  configUSE_MUTEXES:
    comment: USE_MUTEXES
    type: list
    default: '1'
    group: Kernel settings
    values:
    - '0'
    - '1'
  configUSE_RECURSIVE_MUTEXES:
    comment: USE_RECURSIVE_MUTEXES
    type: list
    default: '0'
    group: Kernel settings
    values:
    - '0'
    - '1'
  configUSE_COUNTING_SEMAPHORES:
    comment: USE_COUNTING_SEMAPHORES
    type: list
    default: '1'
    group: Kernel settings
    values:
    - '1'
    - '0'
  configQUEUE_REGISTRY_SIZE:
    comment: QUEUE_REGISTRY_SIZE
    type: integer
    default: '8'
    min: '0'
    max: '255'
    group: Kernel settings
  configUSE_APPLICATION_TASK_TAG:
    comment: USE_APPLICATION_TASK_TAG
    type: list
    default: '0'
    group: Kernel settings
    values:
    - '0'
    - '1'
  configTOTAL_HEAP_SIZE:
    comment: TOTAL_HEAP_SIZE
    type: integer
    default: '768'
    min: =configMINIMAL_STACK_SIZE*4
    max: =1024*$RamSize
    unit: Bytes
    group: Memory management settings
  configHEAP_CLEAR_MEMORY_ON_FREE:
    comment: HEAP_CLEAR_MEMORY_ON_FREE
    type: integer
    default: '0'
    min: '0'
    max: '1'
    group: Memory management settings
  HEAP_NUMBER:
    comment: Memory Management scheme
    type: list
    default: '0'
    group: Memory management settings
    values:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '10'
  configGENERATE_RUN_TIME_STATS:
    comment: GENERATE_RUN_TIME_STATS
    type: list
    default: '0'
    group: Run time and task stats gathering related definitions
    values:
    - '0'
    - '1'
  configUSE_TRACE_FACILITY:
    comment: USE_TRACE_FACILITY
    type: list
    default: '1'
    group: Run time and task stats gathering related definitions
    values:
    - '1'
    - '0'
  configUSE_STATS_FORMATTING_FUNCTIONS:
    comment: USE_STATS_FORMATTING_FUNCTIONS
    type: list
    default: '0'
    group: Run time and task stats gathering related definitions
    values:
    - '0'
    - '1'
  configUSE_IDLE_HOOK:
    comment: USE_IDLE_HOOK
    type: list
    default: '0'
    group: Hook function related definitions
    values:
    - '0'
    - '1'
  configUSE_TICK_HOOK:
    comment: USE_TICK_HOOK
    type: list
    default: '0'
    group: Hook function related definitions
    values:
    - '0'
    - '1'
  configUSE_MALLOC_FAILED_HOOK:
    comment: USE_MALLOC_FAILED_HOOK
    type: list
    default: '0'
    group: Hook function related definitions
    values:
    - '0'
    - '1'
  configCHECK_FOR_STACK_OVERFLOW:
    comment: CHECK_FOR_STACK_OVERFLOW
    type: list
    default: '0'
    group: Hook function related definitions
    values:
    - '0'
    - '1'
    - '2'
  configUSE_CO_ROUTINES:
    comment: USE_CO_ROUTINES
    type: list
    default: '0'
    group: Co-routine related definitions
    values:
    - '0'
    - '1'
  configMAX_CO_ROUTINE_PRIORITIES:
    comment: MAX_CO_ROUTINE_PRIORITIES
    type: integer
    default: '2'
    min: '1'
    max: '255'
    group: Co-routine related definitions
  configUSE_TIMERS:
    comment: USE_TIMERS
    type: list
    default: '0'
    group: Software timer definitions
    values:
    - '0'
    - '1'
  configTIMER_TASK_PRIORITY:
    comment: TIMER_TASK_PRIORITY
    type: integer
    default: '2'
    min: '0'
    max: =configMAX_PRIORITIES-1
    group: Software timer definitions
  configTIMER_TASK_STACK_DEPTH:
    comment: TIMER_TASK_STACK_DEPTH
    type: integer
    default: =configMINIMAL_STACK_SIZE * 2
    min: =configMINIMAL_STACK_SIZE
    max: =MAX_RAM_SIZE/4
    unit: Words
    group: Software timer definitions
  configTIMER_QUEUE_LENGTH:
    comment: TIMER_QUEUE_LENGTH
    type: integer
    default: '10'
    min: '1'
    max: '255'
    group: Software timer definitions
  configLIBRARY_LOWEST_INTERRUPT_PRIORITY:
    comment: LIBRARY_LOWEST_INTERRUPT_PRIORITY
    type: integer
    default: '15'
    min: '1'
    max: '15'
    group: Interrupt nesting behaviour configuration
  configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY:
    comment: LIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY
    type: integer
    default: '5'
    min: '1'
    max: =configLIBRARY_LOWEST_INTERRUPT_PRIORITY
    group: Interrupt nesting behaviour configuration
  configASSERT( x ):
    default: 'if ((x) == 0) {taskDISABLE_INTERRUPTS(); for( ;; );} '
  thread_def:
    default: 'NULL'
  argument:
    default: 'NULL'
  configPRIO_BITS:
    comment: PRIO_BITS
    type: integer
    default: '2'
  INCLUDE_vTaskPrioritySet:
    comment: vTaskPrioritySet
    type: list
    default: '1'
    group: Include definitions
    values:
    - '0'
    - '1'
  INCLUDE_uxTaskPriorityGet:
    comment: uxTaskPriorityGet
    type: list
    default: '1'
    group: Include definitions
    values:
    - '0'
    - '1'
  INCLUDE_vTaskDelete:
    comment: vTaskDelete
    type: list
    default: '1'
    group: Include definitions
    values:
    - '0'
    - '1'
  INCLUDE_vTaskCleanUpResources:
    comment: vTaskCleanUpResources
    type: list
    default: '0'
    group: Include definitions
    values:
    - '0'
    - '1'
  INCLUDE_vTaskSuspend:
    comment: vTaskSuspend
    type: list
    default: '1'
    group: Include definitions
    values:
    - '1'
