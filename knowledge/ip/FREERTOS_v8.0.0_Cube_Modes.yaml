  FirstAddedTab:
    comment: First additional tab
    type: string
    default: Tasks and Queues
  SecondAddedTab:
    comment: Second additional tab
    type: string
    default: Timers and Semaphores
  TasksTableTitle:
    comment: Title for the tasks table
    type: string
    default: Tasks
  TasksColumns:
    comment: Names for the table columns
    type: string
    default: Name;Task Priority;Stack size (Words);Entry function; Code generation option; Parameters
  MaxTasks:
    comment: Maximum number of tasks
    type: integer
    default: '15'
  TasksKeys:
    comment: Keys for config file
    type: string
    default: Tasks01;Tasks02
  Tasks01:
    comment: Tasks (1 to 15)
    type: string
  Tasks02:
    comment: Tasks (16 to ..)
    type: string
  QueuesColumns:
    comment: Names for the table columns
    type: string
    default: Name;Queue size;Item size
  MaxQueues:
    comment: Maximum number of queues
    type: integer
    default: '15'
  QueuesKeys:
    comment: Keys for config file
    type: string
    default: Queues01
  Queues01:
    comment: Queues (1 to 15)
    type: string
  TimersColumns:
    comment: Names for the table columns
    type: string
    default: Name;Callback;Type;Code generation option
  MaxTimers:
