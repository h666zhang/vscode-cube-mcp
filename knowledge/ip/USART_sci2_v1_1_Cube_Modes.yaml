name: USART
version: sci2_v1_1_Cube
parameters:
  Instance:
    comment: Instance
    default: USART$Index
  VirtualMode:
    type: list
    default: VM_ASYNC
    group: Basic Parameters
    values:
    - VM_ASYNC
    - VM_SYNC
    - VM_IRDA
    - VM_SMARTCARD
  VirtualClockMode:
    type: list
    default: VM_SYNC
    group: Basic Parameters
    values:
    - VM_SYNC
    - VM_SMARTCARD
  BaudRate:
    comment: Baud Rate
    type: integer
    default: '115200'
    min: '110'
    max: '10500000'
    unit: Bits/s
    group: Basic Parameters
  WordLength:
    comment: Word Length
    type: list
    default: WORDLENGTH_8B
    group: Basic Parameters
    values:
    - WORDLENGTH_8B
    - WORDLENGTH_9B
  UsartWordLength:
    comment: Word Length
    type: list
    default: USART_WORDLENGTH_8B
    group: Basic Parameters
    values:
    - USART_WORDLENGTH_8B
    - USART_WORDLENGTH_9B
  IrdaWordLength:
    comment: Word Length
    type: list
    default: IRDA_WORDLENGTH_8B
    group: Basic Parameters
    values:
    - IRDA_WORDLENGTH_8B
    - IRDA_WORDLENGTH_9B
  SmartCardWordLength:
    comment: Word Length
    type: list
    default: SMARTCARD_WORDLENGTH_9B
    group: Basic Parameters
    values:
    - SMARTCARD_WORDLENGTH_9B
  UartWordLength:
    comment: Word Length
    type: list
    default: UART_WORDLENGTH_8B
    group: Basic Parameters
    values:
    - UART_WORDLENGTH_8B
    - UART_WORDLENGTH_9B
  StopBits:
    comment: Stop Bits
    type: list
    default: STOPBITS_1
    group: Basic Parameters
    values:
    - STOPBITS_1
    - STOPBITS_2
    - STOPBITS_0_5
    - STOPBITS_1_5
  UsartStopBits:
    comment: Stop Bits
    type: list
    default: USART_STOPBITS_2
    group: Basic Parameters
    values:
    - USART_STOPBITS_2
    - USART_STOPBITS_1
    - USART_STOPBITS_1_5
    - USART_STOPBITS_0_5
  UartStopBits:
    comment: Stop Bits
    type: list
    default: UART_STOPBITS_1
    group: Basic Parameters
    values:
    - UART_STOPBITS_1
    - UART_STOPBITS_2
    - UART_STOPBITS_1_5
  SmartCardStopBits:
    comment: Stop Bits
    type: list
    default: SMARTCARD_STOPBITS_1_5
    group: Basic Parameters
    values:
    - SMARTCARD_STOPBITS_1_5
    - SMARTCARD_STOPBITS_0_5
  Parity:
    comment: Parity
    type: list
    default: PARITY_EVEN
    group: Basic Parameters
    values:
    - PARITY_EVEN
    - PARITY_ODD
    - PARITY_NONE
  UsartParity:
    comment: Parity
    type: list
    default: USART_PARITY_NONE
    group: Basic Parameters
  IrdaParity:
    comment: Parity
    type: list
    default: IRDA_PARITY_NONE
    group: Basic Parameters
  SmartCardParity:
    comment: Parity
    type: list
    default: SMARTCARD_PARITY_EVEN
    group: Basic Parameters
  UartParity:
    comment: Parity
    type: list
    default: UART_PARITY_NONE
    group: Basic Parameters
  Mode:
    comment: Data Direction
    type: list
    default: MODE_TX_RX
    group: Advanced Parameters
    values:
    - MODE_TX_RX
    - MODE_RX
    - MODE_TX
  UsartMode:
    comment: Data Direction
    type: list
    default: USART_MODE_TX_RX
    group: Advanced Parameters
  SmartCardMode:
    comment: Data Direction
    type: list
    default: SMARTCARD_MODE_TX_RX
    group: Advanced Parameters
  IrdaMode:
    comment: Data Direction
    type: list
    default: IRDA_MODE_TX_RX
    group: Advanced Parameters
  UartMode:
    comment: Data Direction
    type: list
    default: UART_MODE_TX_RX
    group: Advanced Parameters
    values:
    - UART_MODE_TX_RX
    - UART_MODE_TX
    - UART_MODE_RX
  HwFlowCtl:
    comment: Hardware Flow Control
    type: list
    default: UART_HWCONTROL_RTS
    group: Basic Parameters
    values:
    - UART_HWCONTROL_RTS
    - UART_HWCONTROL_CTS
    - UART_HWCONTROL_RTS_CTS
    - UART_HWCONTROL_NONE
  OverSampling:
    comment: Over Sampling
    type: list
    default: 'null'
    group: Advanced Parameters
    values:
    - 'null'
    - UART_OVERSAMPLING_16
  CLKPolarity:
    comment: Clock Polarity
    type: list
    default: SMARTCARD_POLARITY_LOW
    group: Clock Parameters
    values:
    - SMARTCARD_POLARITY_LOW
    - SMARTCARD_POLARITY_HIGH
    - USART_POLARITY_LOW
    - USART_POLARITY_HIGH
  CLKPhase:
    comment: Clock Phase
    type: list
    default: SMARTCARD_PHASE_1EDGE
    group: Clock Parameters
    values:
    - SMARTCARD_PHASE_1EDGE
    - SMARTCARD_PHASE_2EDGE
    - USART_PHASE_1EDGE
    - USART_PHASE_2EDGE
  CLKLastBit:
    comment: Clock Last Bit
    type: list
    default: SMARTCARD_LASTBIT_DISABLE
    group: Clock Parameters
    values:
    - SMARTCARD_LASTBIT_DISABLE
    - SMARTCARD_LASTBIT_ENABLE
    - USART_LASTBIT_DISABLE
    - USART_LASTBIT_ENABLE
  IrDAMode:
    comment: IrDa Mode
    type: list
    default: IRDA_POWERMODE_NORMAL
    group: Advanced Parameters
    values:
    - IRDA_POWERMODE_LOWPOWER
    - IRDA_POWERMODE_NORMAL
  Prescaler:
    comment: Prescaler
    type: integer
    default: '1'
    min: '1'
    max: '1'
    group: Advanced Parameters
  CalculateSpeed:
    comment: SmartCard Clock Frequency
    type: string
    default: '5000000'
    group: Clock Parameters
  NACKState:
    comment: NAck if Parity Error
    type: list
    default: SMARTCARD_NACK_DISABLE
    group: Advanced Parameters
    values:
    - SMARTCARD_NACK_DISABLE
    - SMARTCARD_NACK_ENABLE
  GuardTime:
    comment: Guard Time
    type: integer
    default: '0'
    min: '0'
    max: '255'
    group: Advanced Parameters
  WakeUpMethode:
    comment: Wake-Up Method
    type: list
    default: UART_WAKEUPMETHOD_IDLELINE
    group: Advanced Parameters
    values:
    - UART_WAKEUPMETHOD_IDLELINE
    - UART_WAKEUPMETHOD_ADDRESSMARK
  Address:
    comment: Wake-Up Address
    type: integer
    default: '0'
    min: '0'
    max: '15'
    group: Advanced Parameters
  BreakDetectLength:
    comment: Break Detect Length
    type: list
    default: UART_LINBREAKDETECTLENGTH_10B
    group: Advanced Parameters
    values:
    - UART_LINBREAKDETECTLENGTH_10B
    - UART_LINBREAKDETECTLENGTH_11B
signals:
  CK:
    io_mode: AlternateFunctionPushPull
  CTS:
    io_mode: InputFloatingAndPullUp
  RTS:
    io_mode: AlternateFunctionPushPull
  RX:
    io_mode: InputFloatingAndPullUp
  TX:
    io_mode: AlternateFunctionPushPullUp
modes:
- name: usartBasic
  hal_mode: ''
  parameters:
  - BaudRate
- name: Asynchronous
  hal_mode: UART
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - HwFlowCtl
  - Mode
  - OverSampling
  possible_values:
    VirtualMode:
    - VM_ASYNC
- name: Synchronous
  hal_mode: USART
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - Mode
  - CLKPolarity
  - CLKPhase
  - CLKLastBit
  possible_values:
    VirtualMode:
    - VM_SYNC
- name: Half_duplex(single_wire_mode)
  hal_mode: UART
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - Mode
  - OverSampling
  possible_values:
    VirtualMode:
    - VM_ASYNC
- name: Multiprocessor_communication
  hal_mode: UART
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - Mode
