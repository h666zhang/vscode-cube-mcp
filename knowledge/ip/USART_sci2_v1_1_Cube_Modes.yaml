  - WordLength
  - Parity
  - Mode
  - IrDAMode
  - Prescaler
  possible_values:
    VirtualMode:
    - VM_IRDA
- name: LIN
  hal_mode: UART
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - Mode
  - BreakDetectLength
  possible_values:
    VirtualMode:
    - VM_ASYNC
- name: SmartCard
  hal_mode: SMARTCARD
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - WordLength
  - Parity
  - StopBits
  - Mode
  - NACKState
  - GuardTime
  possible_values:
    VirtualMode:
    - VM_SMARTCARD
- name: SmartCard_With_Clock
  hal_mode: SMARTCARD
  base_mode: usartBasic
  parameters:
  - VirtualMode
  - VirtualClockMode
  - WordLength
  - Parity
  - StopBits
  - Mode
  - NACKState
  - GuardTime
  - Prescaler
  - CalculateSpeed
  - CLKPolarity
  - CLKPhase
  - CLKLastBit
  possible_values:
    VirtualMode:
    - VM_SMARTCARD
    VirtualClockMode:
    - VM_SMARTCARD
- name: CTS_Only
  hal_mode: ''
  parameters: []
- name: RTS_Only
  hal_mode: ''
  parameters: []
- name: CTS_RTS
  hal_mode: ''
  parameters: []
