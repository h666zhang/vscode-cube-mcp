name: GPIO
version: STM32F103x8_gpio_v1_0
parameters:
  GPIO_AF:
    comment: GPIO Alternate Function
    type: list
    default: 'null'
  GPIOx:
    comment: GPIO address
    type: list
  GPIO_Pin:
    comment: GPIO pin mask
    type: list
  PinState:
    comment: GPIO output level
    type: list
    default: GPIO_PIN_RESET
  GPIO_ModeDefaultPP:
    comment: GPIO mode
    type: list
    default: GPIO_MODE_AF_PP
  GPIO_ModeDefaultOD:
    comment: GPIO mode
    type: list
    default: GPIO_MODE_AF_OD
  GPIO_ModeDefaultOutputPP:
    comment: GPIO mode
    type: list
    default: GPIO_MODE_OUTPUT_PP
  GPIO_ModeDefaultEXTI:
    comment: GPIO mode
    type: list
    default: GPIO_MODE_IT_RISING
  GPIO_Mode:
    comment: GPIO mode
    type: list
  GPIO_PuPdOD:
    comment: GPIO Pull-up/Pull-down
    type: list
    default: GPIO_PULLUP
  GPIO_PuPd:
    comment: GPIO Pull-up/Pull-down
    type: list
    default: GPIO_NOPULL
  GPIO_Pu:
    comment: GPIO Pull-up/Pull-down
    type: list
    default: GPIO_NOPULL
  GPIO_Speed:
    comment: Maximum output speed
    type: list
    default: GPIO_SPEED_FREQ_LOW
  GPIO_Speed_High_Default:
    comment: Maximum output speed
    type: list
    default: GPIO_SPEED_FREQ_HIGH
  GPIO_Mode_For_EXTI_LL:
    comment: GPIO mode
    type: list
    default: GPIO_MODE_INPUT
signals: {}
modes:
- name: GPIO
  hal_mode: ''
  parameters:
  - GPIO_Pin
  - GPIO_Speed
  - GPIO_PuPd
  - GPIOx
  - GPIO_Mode
  - GPIO_AF
- name: Analog
  hal_mode: ''
  parameters:
  - GPIOx
  - GPIO_Mode
  - GPIO_Pin
  possible_values:
    GPIO_Mode:
    - GPIO_MODE_ANALOG
- name: Input
  hal_mode: ''
  parameters:
  - GPIO_PuPd
  - GPIOx
  - GPIO_Mode
  - GPIO_Pin
  possible_values:
    GPIO_Mode:
    - GPIO_MODE_INPUT
- name: InputFloating
  hal_mode: ''
  parameters:
  - GPIO_PuPd
  - GPIOx
  - GPIO_Mode
  - GPIO_Pin
  possible_values:
    GPIO_PuPd:
    - GPIO_NOPULL
    GPIO_Mode:
    - GPIO_MODE_INPUT
- name: InputFloatingAndPullUp
  hal_mode: ''
  parameters:
  - GPIO_PuPd
  - GPIOx
