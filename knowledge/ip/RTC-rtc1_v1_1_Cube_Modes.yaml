  - AsynchPrediv
  - OutPut
- name: Date
  hal_mode: RTC
  parameters:
  - WeekDay
  - Month
  - Date
  - Year
- name: Tamper
  hal_mode: RTC
  base_mode: Tamper_basic
  parameters:
  - Tamper
  - Trigger
  possible_values:
    Tamper:
    - RTC_TAMPER_1
- name: Tamper
  hal_mode: RTC
  base_mode: Tamper_basic
  parameters:
