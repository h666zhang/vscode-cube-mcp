  - Hours_A
  - Minutes_A
  - Seconds_A
- name: RTC_OUT_NO
  hal_mode: RTC
  base_mode: RTC_Init_And_Calender_Settings
  parameters:
  - Alarm_A
  - Hours_A
  - Minutes_A
  - Seconds_A
- name: RTC_OUT_NO
  hal_mode: RTC
  base_mode: RTC_Init_And_Calender_Settings
  parameters:
  - Alarm_A
  - Hours_A
  - Minutes_A
  - Seconds_A
