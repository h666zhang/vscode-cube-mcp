# cubemx_help 的返回值:工具与外设的使用说明
# 本文件是 cubemx_help 的唯一知识源(knowledge_loader 读取);改这里等于改 cubemx_help 的输出
source: 本文件即来源 —— 0.4.4.1 起 help 文本由 knowledge_loader 直接读本 YAML;cubemx_mcp.py 里原有的硬编码 help 常量(_GUIDE 等)已删除
guide: |-
  Vscode_cube_mcp — 封装 STM32CubeMX 命令行(-q)的 MCP server
  =============================================================
  【能力边界(先读)】
  本工具只负责 **.ioc 工程配置与 HAL 骨架生成**：
  引脚 / 外设 / 时钟 / 工具链的配置，以及 generate 出可编译的 HAL 工程。
  **不生成应用业务代码**（LED 闪烁、OLED 显示内容、传感器驱动、中断处理逻辑等），
  这些请在生成后的工程里自行编写——配置到骨架为止，剩下是你的代码。

  【工具一览(11 个)】
    cubemx_help                本指南(当前)
    cubemx_new_project         从零生成 HAL 工程(首选入口)
    cubemx_intent              按"配置意图"改 .ioc(只说要什么,内部名查知识库;0.4.4.1 新增)
    cubemx_probe               在 .ioc 副本上试跑(commands 脚本命令 / inject 键注入)并给出差异(收录新外设用)
    cubemx_load                回读配置 + 结构化摘要(默认只解析文本、秒回;via_cubemx=True 才让 CubeMX 真加载)
    cubemx_configure           加载 .ioc,执行 set 命令序列并写回
    cubemx_generate            加载 .ioc 生成 HAL 代码
    cubemx_export_pinout       导出引脚配置 CSV(只读)
    cubemx_remove_peripheral   从 .ioc 移除外设
    cubemx_inspect_output      看生成产物:文件树 + Core/Src 函数签名 + pattern 匹配行(只读,不给全文)
    cubemx_raw_script              任意 CubeMX 脚本命令(原始脚本接口)

  【从零生成工程(标准流程)】
  1) 调 cubemx_help(topic="templates") 查看可用芯片模板
  2) cubemx_new_project(project_name="Demo", project_dir="C:/MINE/STM32Project/Demo",
     mcu="STM32F103C8T6",
     intents=[{"peripheral": "ADC1", "pins": ["PA0", "PA1"], "dma": {"mode": "circular"}},
              {"peripheral": "TIM3", "mode": "internal_clock", "prescaler": 72, "period": 100},
              {"peripheral": "I2C1", "pins": ["PB8", "PB9"]}])
     **推荐用 intents**(与 cubemx_intent 同一套解析:配 ADC 自动补合法时钟、配 DMA 查通道表);
     commands(原始 set 命令)仍可用,两者可以混用(intent 的命令排在前面)
  3) 自己的库(.c / .h)写进"用户区",**位置看工具链**:
     - CMake(默认):工程根 CMakeLists.txt —— .c 写进 `# Add sources to executable`,
       .h 目录写进 `# Add include paths`(该文件只生成一次,不会被覆盖)
     - STM32CubeIDE:`STM32CubeIDE/Application/User/Core/`(工具链自带的用户区,同样只在首次生成时创建)
     - EWARM / MDK-ARM(实测 2026-10-15):生成 `Core/` + `Drivers/` + `EWARM|MDK-ARM/`,**没有**
      `Application/User` 那种独立用户区 —— 用户代码写 `Core/Src/*.c` 的 `/* USER CODE BEGIN */` 块里
     别往 `cmake/stm32cubemx/CMakeLists.txt` 里加(每次 generate 全量重写)

  【失败时会怎样(动手前先读)】
  new_project 的步骤固定为 `locate_template → compose_ioc → resolve_intent → run_cubemx`,
  报错信息里会写明是哪一步失败(形如 `[resolve_intent|PIN_CONFLICT]`)。**落盘时机**:
  - 卡在 `locate_template`(芯片没模板)⇒ 不会建任何文件;
  - 过了 `compose_ioc`(已复制模板、改工程名、写 .ioc)之后失败 ⇒ 目录里会留下**半成品 .ioc**
    (只有模板内容、外设没配上);**工具不会自动清理**,换个新目录重来即可。
  常见错误码:`MCU_TEMPLATE_MISSING`(没有该芯片模板,错误里给可用模板与新建模板的方法)、
  `PIN_CONFLICT`(一个引脚被两个意图抢)、`UNKNOWN_PIN_SIGNAL`(引脚名不在这颗芯片上)、
  `BAD_ARGUMENT`(参数值不合法,会列出可用取值)。

  【意图(intents / cubemx_intent)支持哪些外设】
  - **有专门解析的**(字段多,优先用意图):
      ADCx     pins(多通道,顺序即 Rank)/ sampling_time / continuous / scan / trigger / dma / interrupt
      TIMx     mode(pwm / input_capture / internal_clock)/ pin / freq_hz / duty / prescaler /
               period / pulse / irq(或 interrupt)
      GPIO     pin / mode(output 等)/ label
  - **只按"引脚 + 模式"处理的**(字段少,更细的参数用 commands 或本 topic 里的 set 命令):
      I2Cx / USARTx / SPIx / CAN / RTC / IWDG / WWDG
      例如 {"peripheral": "I2C1", "pins": ["PB8", "PB9"]}(内部就是 set pin + set mode 三条)
  - 各外设的详细字段:**有 topic 看 topic**(adc / tim / dma / nvic / i2c / usart / spi …),
    其余以 knowledge/rules/<外设>.yaml 为准;字段写错或查不到时工具会**报错**并给出可用值,
    不会静默忽略。拿不准能不能用意图表达时,先按意图写 —— 工具返回里会写明它最终走的是
    意图解析还是 set 命令。
  - **`cubemx_intent` 的 `generate` 参数**:默认 False(只改 .ioc);写 `generate=True`
    会在改完顺手跑一次 project generate(HAL 代码一起更新)。
  - 每次成功调用后,返回里都会附一段**「本次采用的默认值/推导值」** —— 凡是你没显式给的、
    由默认值或工具推导出来的字段都在那里,不必再回读 .ioc 或去翻文档。

  【执行顺序与注入时机(重要:写意图/命令前先读)】
  new_project 与 intent 的内部顺序固定,不要假设:
  1) 意图(intents)先执行:TIM 内部时钟是**就地注入 .ioc**(在 CubeMX 脚本之前),
     所以意图里的 TIM 在这一步就已写进 .ioc;
  2) 然后才跑 CubeMX 脚本:`config load` → 执行 commands 里的 set 命令 → `config saveas`
     —— 因此 **commands 中针对某 TIM 的 set 命令(如 TIM_MasterOutputTrigger)能生效的前提,
        是该 TIM 已经存在于 .ioc**(意图注入的,或模板里本来就有);
        外设未激活时 `set ip parameters ...` 会被 CubeMX **静默忽略**(不报错,白设);
  3) 最后注入"脚本配不了"的键(NVIC 中断行、DMA 键组),时机是 **saveas 之后、generate 之前**;
  4) 若 commands 里含 "set ip parameters TIMx ClockSource TIM_CLOCKSOURCE_INTERNAL",
     server 会在第 3 步再注入一次 TIM 内部时钟(**幂等**:已存在就跳过)。
  实践结论(实测):让 TIM 当触发源 → TIM 用 intent 配(先落进 .ioc),
    `set ip parameters TIMx TIM_MasterOutputTrigger TIM_TRGO_UPDATE` 放 commands;
    顺序反了 TRGO 会静默丢失(硬件不触发,但 generate 不报错)。

  【离线预检(每次改完自动跑,不需要 CubeMX)】
  改完 .ioc 后工具会用纯文本检查一遍"CubeMX 不会报错、但配置是错的"组合问题,例如:
    - 设了 ADC 外部触发,但触发源的 TIM 不在外设列表里 / 没配 TIM_MasterOutputTrigger;
    - 配了 ADC 但没设 RCC.ADCPresc(或 ADCCLK 超上限 —— 会让 generate 卡死);
    - DMA 键组不成套(IP 列表里没有 DMA、请求序号对不上、通道中断没使能)。
  问题会直接附在 cubemx_intent / cubemx_new_project 的返回里;cubemx_load 的结构化摘要
  里也有(cubemx_load 返回里的 "precheck" 字段)。**所以这类错误不必起 CubeMX 试**。

  【cubemx_new_project 参数(默认值而非强制)】
    mcu           默认 STM32F103C8T6,匹配 templates/{mcu}.ioc
    toolchain     默认 "CMake"(可覆盖 "EWARM V8.32"/"MDK-ARM"/"STM32CubeIDE")
    couple_files  默认 True(每个外设生成独立 .c/.h);False 则集中到 main.c
    clock_source  默认 "HSE"(外部晶振,72MHz);"HSI" 用内部 RC
    pll_mul       默认 9(8MHz×9=72MHz);HSI 常用 16 → 64MHz
    intents       配置意图列表(推荐),见上面第 2 步
    commands      set 命令列表(原始接口),如 ["set pin PB13 GPIO_Output"]
    template      指定模板路径,优先于 mcu 查找

  【外设配置命令与已知坑】
  - GPIO:set pin PB13 GPIO_Output;set gpio parameters PB13 GPIO_Label LED
  - I2C:set pin PB8 I2C1_SCL;set pin PB9 I2C1_SDA;set mode I2C1 I2C
  - TIM 内部时钟(重要):脚本 set mode TIM2 一律 KO;set ip parameters TIM2
    ClockSource TIM_CLOCKSOURCE_INTERNAL 只改参数不改 SH/VP 表达(GUI 仍显示
    ETR)。可靠做法:new_project 命令含 "set ip parameters TIMx ClockSource
    TIM_CLOCKSOURCE_INTERNAL" 时 server 自动注入 6.18 验证过的标准表达
  - 时钟坑:对 RCC 执行 set 命令(如 PLLMUL)会丢 RCC.PLLSourceVirtual=HSE,
    时钟静默降级 HSI(64MHz 而非 72MHz);改时钟优先用 new_project 的
    clock_source/pll_mul 参数
  - 自定义源文件写哪里:cmake/stm32cubemx/CMakeLists.txt 每次 generate 都被重写(别动);
    工程根 CMakeLists.txt 只生成一次 —— .c 写进 # Add sources to executable,
    .h 目录写进 # Add include paths,不会丢

  【约束】
  - 所有 .ioc / 生成路径必须在 ST_CUBEMX_ALLOWED_ROOTS 白名单内
  - 工程名仅字母/数字/下划线;路径写绝对路径(Windows 建议 C:/ 正斜杠)
new_project: |-
  【从零生成工程(cubemx_new_project)】
  流程:
  1) 先调 cubemx_help(topic="templates") 查看可用芯片模板
  2) cubemx_new_project(project_name="Demo", project_dir="C:/MINE/STM32Project/Demo",
     mcu="STM32F103C8T6",
     intents=[{"peripheral": "ADC1", "pins": ["PA0", "PA1"], "dma": {"mode": "circular"}},
              {"peripheral": "I2C1", "pins": ["PB8", "PB9"]}])
     intents 走与 cubemx_intent 同一套解析(配 ADC 自动补时钟、配 DMA 查通道表);
     也可以用原始 commands=["set pin PB13 GPIO_Output"],两者可混用
  3) 自己的库(.c / .h)写进"用户区",位置看工具链:
     - CMake(默认):工程根 CMakeLists.txt 的 `# Add sources to executable` / `# Add include paths`
     - STM32CubeIDE:`STM32CubeIDE/Application/User/Core/`
     (两者都只在首次生成时创建,之后不会被覆盖)

  project_dir 行为:目录不存在会**自动创建**;**已存在则直接用**(不清理里面的旧文件,
  上一次的产物和 .ioc.bak 会留下 —— 要干净工程就换个新目录)。
  想额外生成到另一个目录:用 cubemx_generate(ioc, project_dir=别的目录)(工具会把 .ioc
  复制过去就地生成,原 .ioc 不动);**不要**在脚本里用 `project path`(6.18 已失效)。
  目标目录会因此**多出一份 <工程名>.ioc 副本**(以后想再生成,直接用那份即可);
  它是新复制过去的,所以目标目录里**不会**有 `.ioc.bak`(备份只在工具改写已有 .ioc 时产生)。

  参数(默认值而非强制):
    mcu           默认 STM32F103C8T6,匹配 templates/{mcu}.ioc
    toolchain     默认 "CMake"(可覆盖 "EWARM V8.32"/"MDK-ARM"/"STM32CubeIDE")
    couple_files  默认 True(每个外设独立 .c/.h);False 则集中到 main.c
    clock_source  默认 "HSE"(72MHz);"HSI" 用内部 RC
    pll_mul       默认 9(8MHz×9=72MHz);HSI 常用 16 → 64MHz
    intents       配置意图列表(推荐),见上面第 2 步
    commands      set 命令列表(原始接口),如 ["set pin PB13 GPIO_Output"]
    template      指定模板路径,优先于 mcu 查找

  注意:找不到 {mcu}.ioc 模板时错误信息会列出可用模板,并按指引生成新芯片模板。
probe: |-
  【探针(cubemx_probe):把"还没实测过"的写法跑出真实差异,再收录进知识库】
  - 两种输入,可以同时给:
      commands: CubeMX 脚本命令(如 ["set mode USART2 Asynchronous"])
      inject:   .ioc 键注入 —— 脚本配不了的写法全走这里,每项形如
                {"type": "dma", "request": "ADC1", "channel": "DMA1_Channel1", "mode": "DMA_CIRCULAR"}
                {"type": "tim_internal_clock", "target_tim": "TIM2", "prescaler": 72, "period": 100}
                {"type": "tim_pwm", "target_tim": "TIM3", "pin": "PA6", "signal": "S_TIM3_CH1"}
                {"type": "tim_input_capture", "target_tim": "TIM2", "pin": "PA0-WKUP", "signal": "S_TIM2_CH1_ETR"}
                {"type": "lines", "lines": ["NVIC.USART2_IRQn=true\\:0\\:0\\:false\\:false\\:true\\:true\\:true\\:true"]}
  - 给了 inject 时,工具还会让 CubeMX load + saveas 走一遍,并在输出里写明它**原样保留了**
    还是**改写/丢弃了**注入内容;改写了会多附一段差异(注入后 vs 归一化后)
  - 基线 .ioc 只读;keep_copy=True 会把副本(aa.probe.ioc)保留在磁盘上
  - 拿到差异后整理进 knowledge/rules/<外设>.yaml(标 verified 与来源)
peripheral:
  gpio: |-
    【GPIO(已验证)】
      set pin PB13 GPIO_Output
      set gpio parameters PB13 GPIO_Label LED
    示例:LED 在 PB13 → 命令序列如上。
    - 用意图写:{"peripheral": "GPIO", "pin": "PB13", "mode": "output", "label": "LED"}
      字段名就是 `label`(对应上面那条 `GPIO_Label`);`mode` 写 output / input 等。
      生成后引脚会变成宏:main.h 里 `#define LED_Pin GPIO_PIN_13` / `#define LED_GPIO_Port GPIOB`。
    - **调试口那 5 个脚**(F103:PA13/PA14/PA15/PB3/PB4):本工具模板用 **SWD**,只占 PA13/PA14,
      所以 PA15/PB3/PB4 可以直接当 GPIO;PA13/PA14 被占着,要动它们得先改 SYS 的 Debug 设置
      或换引脚(工具报 PIN_CONFLICT 时会点名"调试口",不会只丢一个 SYS_JTMS-SWDIO 给你看)。
    - 引脚名可写短名(如 PA0),工具会归一化成 `.ioc` 里的名字(PA0-WKUP)—— `set gpio parameters`
      那条命令**必须**用归一化后的名字,否则 CubeMX 返回 KO(实测踩过)。
  i2c: |-
    【I2C(已验证;实测 2026-08-06 + 2026-10-12 生成回读)】
      set pin PB8 I2C1_SCL
      set pin PB9 I2C1_SDA
      set mode I2C1 I2C
    生成 i2c.c + main.c 调用 MX_I2C1_Init。
    - **默认就是标准模式 100kHz,不用额外配**:生成代码里 hi2c1.Init.ClockSpeed = 100000、
      DutyCycle = I2C_DUTYCYCLE_2(100kHz 下无意义,CubeMX 默认项)、AddressingMode = 7BIT、
      OwnAddress1 = 0(从机地址,做主机时不用管)。
    - **不要中断、不要 DMA 时什么都不用写**:上面三条命令不会使能任何 NVIC 中断、也不会挂
      DMA 请求(要中断才写 {"interrupt": true};要 DMA 才加 dma 字段)。
    - 用意图时写 {"peripheral": "I2C1", "pins": ["PB8", "PB9"]}(内部就是那三条 set 命令);
      想改时钟频率等细节用 commands 单独 set。
    - **PB8/PB9 在 F103 上是 I2C1 的重映射引脚**:CubeMX 会自动补
      `__HAL_AFIO_REMAP_I2C1_ENABLE()`(实测生成代码里有),属正常现象 ——
      排查"PB8/PB9 没波形"时先确认这行在不在。
  tim: |-
    【TIM 内部时钟(重要,有坑)】
    - set mode TIM2 一律 KO;set ip parameters TIM2 ClockSource TIM_CLOCKSOURCE_INTERNAL
      只改参数、不改 SH/VP 表达,CubeMX GUI 仍显示 ETR;手写 VP_TIMx 表达会被
      generate 静默清理。
    - 可靠做法:new_project 的 commands 里含
      "set ip parameters TIMx ClockSource TIM_CLOCKSOURCE_INTERNAL",
      server 自动注入 6.18 验证过的内部时钟标准表达(任意 TIM 均可,不依赖模板)。
    - 1s 中断参数:72MHz 下 Prescaler=7199 + Period=9999(工具接口上传的是"分频比/计数"
      7200 / 10000,注入时自动减 1 落成寄存器值)。
    - 更新中断:注入片段默认带 NVIC(会生成 TIMx_IRQHandler);只拿它当触发源、不要中断时,
      意图里写 "irq": false(写 "interrupt": false 同义)。
    - TRGO 输出(给别的外设当触发源,如 ADC 的外部触发):可以用 set 命令配 ——
      set ip parameters TIM3 TIM_MasterOutputTrigger TIM_TRGO_UPDATE
      实测有效(2026-10-12):CubeMX 会自动把 TIM_MasterOutputTrigger 补进 TIMx.IPParameters。
      用 TIM 触发 ADC 时这一步不能漏:只设 ADC 的 ExternalTrigConv、触发源没有 TRGO 输出,
      generate 会弹窗卡死(见 topic="adc")。

    【TIM 意图字段(cubemx_intent / new_project 的 intents)】
      {"peripheral": "TIM3", "mode": "internal_clock", "freq_hz": 10000, "irq": false}
      mode              internal_clock / pwm / input_capture(必填)
      pin               引脚(信号名由知识库查表,不猜)
      freq_hz           业务参数:按该 TIM 的实际时钟自动算分频 —— **internal_clock 也支持**,
                        不必自己手算 prescaler/period(72MHz + freq_hz=10000 会自动分配)
      prescaler         分频**比**,注入时自动减 1 落成寄存器值(传 7200 → 寄存器 7199)
      period            计数**值**,同样自动减 1(传 10000 → 寄存器 9999)
      duty / pulse      pwm 专用:占空比 / 脉冲计数
      irq(或 interrupt)**默认 true**:internal_clock 的注入片段默认带 NVIC(会生成
                        TIMx_IRQHandler);只拿它当触发源、不要中断时才写 "irq": false
      显式给的 prescaler/period 优先于 freq_hz。

    【TIM PWM(6.18 标准表达注入,0.4.1 起)】
    - 命令:set ip parameters TIM3 PWM <pin> <signal> [Prescaler n] [Period n] [Pulse n]
      例:set ip parameters TIM3 PWM PA6 S_TIM3_CH1 Prescaler 72 Period 100 Pulse 50
         → 72MHz/72/100 = 10kHz,占空比 50/100 = 50%
    - 常用引脚→信号(STM32F103):PA6→S_TIM3_CH1、PA7→S_TIM3_CH2、PB0→S_TIM3_CH3、
      PB1→S_TIM3_CH4;PA0-WKUP→S_TIM2_CH1_ETR、PA1→S_TIM2_CH2。
    - .ioc 内部枚举名带序号:"PWM Generation1 CH1"(GUI 名 "PWM Generation CH1"),
      写错会被 CubeMX 静默丢弃(实测:整个 TIM 从 IP 列表消失)。

    【TIM 输入捕获(6.18 标准表达注入,0.4.1 起)】
    - 命令:set ip parameters TIM2 InputCapture <pin> <signal> [Prescaler n] [Period n]
      例:set ip parameters TIM2 InputCapture PA0-WKUP S_TIM2_CH1_ETR Prescaler 72 Period 65535
    - 自动配 IC1 上升沿(direct)+ IC2 下降沿参数(IC2Polarity=FALLING/IC2Selection=INDIRECTTI),
      TIM2 中断自动启用。
    - 已知限制(实测):CubeMX 只生成 IC1 的 sConfigIC;测占空比需在 main.c 手动补 IC2:
        TIM_IC_InitTypeDef ic2 = {0};
        ic2.ICPolarity  = TIM_INPUTCHANNELPOLARITY_FALLING;
        ic2.ICSelection = TIM_ICSELECTION_INDIRECTTI;
        ic2.ICPrescaler = TIM_ICPSC_DIV1;
        ic2.ICFilter    = 0;
        HAL_TIM_IC_ConfigChannel(&htim2, &ic2, TIM_CHANNEL_2);
        HAL_TIM_IC_Start_IT(&htim2, TIM_CHANNEL_2);
    - PA0 的 .ioc 信号名是组合名 S_TIM2_CH1_ETR(不是 S_TIM2_CH1)。
    - .ioc 内部枚举名:Input_Capture1_from_TI1(GUI 名 "Input Capture direct mode")。
  rcc: |-
    【时钟(RCC,有坑)】
    - 模板已配好 HSE 8MHz × PLL9 = 72MHz,一般无需改。
    - **定时器时钟要按 APBx 的 2 倍算**:APB 分频 ≠ 1 时,TIMx 的计数时钟 = APBx × 2
      (F103 默认 APB1 = 36MHz ⇒ TIM2/3/4 实际跑 **72MHz**;APB2 = 72MHz ⇒ TIM1 也是 72MHz)。
      所以 10kHz = 72MHz ÷ 7200,不是 36MHz ÷ 3600 —— 摘要里的 `APB1Freq_Value` 看不出这一点。
      用意图的 `freq_hz` 时工具按这条规则自动换算,不必自己算。
    - 对 RCC 执行 set 命令(如 PLLMUL)会把 RCC.PLLSourceVirtual=HSE 弄丢,
      时钟静默降级 HSI(如 64MHz 而非 72MHz)。
    - 改频率优先用 cubemx_new_project 的 clock_source/pll_mul 参数;
      需要手动 set 时同时补:
      set ip parameters RCC PLLSourceVirtual RCC_PLLSOURCE_HSE
      set ip parameters RCC PLLMUL RCC_PLL_MUL9
      set ip parameters RCC SYSCLKSource RCC_SYSCLKSOURCE_PLLCLK
      set ip parameters RCC APB1CLKDivider RCC_HCLK_DIV2
  usart: |-
    【USART(探针实测 2026-10-10)】
    - 命令:set mode USART2 Asynchronous;set ip parameters USART2 BaudRate 9600;
      set pin PA2 USART2_TX / set pin PA3 USART2_RX
    - 和 TIM 不一样:USART 的 set mode 是有效的。
    - BaudRate 等于 db 默认值 115200 时,CubeMX 不会写出 USARTx.BaudRate 行;换成别的值才出现
      (探针里看不到不代表命令无效)。
    - 中断:**不写 `interrupt` 就是不开**(默认 false),不会生成 `USART2_IRQHandler`;要中断才写
      "interrupt": true(靠注入 .ioc 键实现)。
    - **别和 DMA 通道中断搞混**:加 `dma` 字段会另外开出 DMA 通道中断(`DMA1_ChannelX_IRQHandler`),
      那是搬运中断、不是串口收发中断 —— 详见 topic="dma"。
    - 接收用 DMA 时一般显式写 `"mode": "circular"`(不写的话 UART 接收默认是 `DMA_NORMAL`,只搬一次)。
  spi: |-
    【SPI(探针实测 2026-10-10 + generate 计时实测 2026-10-15)】
    - 命令:set mode SPI1 Full_Duplex_Master;set pin PA5 SPI1_SCK / PA6 SPI1_MISO / PA7 SPI1_MOSI
    - 模式名用下划线:Full_Duplex_Master / Full_Duplex_Slave / RX_Only_Simplex_Unidirect_Master /
      TX_Only_Simplex_Unidirect_Master。
    - 引脚侧的 Mode 也写 SPI 的模式名(PA5.Mode=Full_Duplex_Master),不是 GPIO_Output 那种。
    - **波特率必须落在上限内**(F103 上限 18 MBits/s):CubeMX 默认 Prescaler=2,在 APB2=72MHz 下
      等于 36 MBits/s —— 超限时 CubeMX 记 `IP not ready for code generation: SPIx` 并弹 Parameter
      Error 对话框,`-q` 批处理没人点会卡死,而且**报 OK 却一个文件都不产出**。
      **要两条命令一起发**:`set ... BaudRatePrescaler` 不会重算 `CalculateBaudRate`,只改预分频
      时 CubeMX 仍按那个旧值判定(实测 → `IP not ready`),工具现在两条都补。
      `cubemx_intent` 会按该 SPI 挂的总线频率自动补最小合法分频:SPI1(APB2 72MHz) -> 4、
      SPI2(APB1 36MHz) -> 2。要指定就写意图里的 `prescaler`(枚举名或数字,如 8 或
      "SPI_BAUDRATEPRESCALER_8"),超限会被直接拒绝。
    - 合法分频(2 的幂):SPI_BAUDRATEPRESCALER_2 / 4 / 8 / 16 / 32 / 64 / 128 / 256;
      波特率 = 该总线频率 / 分频。
  adc: |-
    【ADC(实测 + generate 回读验证 2026-10-10)】
    - 意图字段(默认值而非强制):pin / pins(多通道) / sampling_time / continuous /
      scan / trigger / adc_clock_div / interrupt
    - 命令:set mode ADC1 IN0;set pin PA0-WKUP ADC1_IN0
    - 模式名就是通道号:PA0-WKUP->IN0、PA1->IN1、PA5->IN5;引脚可写短名 PA0(自动归一化)。
    - 多通道(实测):pins 顺序即 Rank 顺序,工具自动补 NbrOfConversion + 每个通道一组
      Rank-n / Channel-n / SamplingTime-n(set mode INn 本身不写转换序列)。
    - 采样时间:sampling_time="ADC_SAMPLETIME_55CYCLES_5"(默认 1.5 周期)。**F103 全部可选**:
      ADC_SAMPLETIME_1CYCLE_5 / 7CYCLES_5 / 13CYCLES_5 / 28CYCLES_5 / 41CYCLES_5 /
      55CYCLES_5 / 71CYCLES_5 / 239CYCLES_5(写错会被工具拦下并列出这张表)。
      **多通道时给一个值就统一用于所有通道**(SamplingTime-0..N 都写同一个);要逐通道不同
      得用 commands 单独 set SamplingTime-n#ChannelRegularConversion。
    - **必配 ADC 时钟**:不配 generate 会弹 [Clock] 对话框把 -q 批处理卡死;72MHz PCLK2 下
      用 RCC_ADCPCLK2_DIV6(12MHz ≤ F103 的 14MHz 上限)。工具按 .ioc 的 APB2 频率自动补。
      `adc_clock_div` 的合法值:**DIV2 / DIV4 / DIV6 / DIV8**;而且**显式给超上限的值会被拒绝**,
      报错里会告诉你当前 APB2 频率下该用哪个(超限的 generate 会卡死)。
      注意 **值等于库默认分频(DIV2)时 CubeMX 不写 `RCC.ADCPresc` 这一行** ——
      这时要看 `RCC.ADCFreqValue`(CubeMX 算出的实际频率),别把"没这行"读成"没设"。
    - 连续/扫描:**continuous 默认 false(不写就是不连续)**;写 continuous=True 才开。
      有外部触发(trigger)时:false = 每次触发转换一整轮;true = 第一次触发后 ADC 自由
      连续转换、触发退化成启动信号(此时让 TIM 定频触发就失去意义)。多通道 scan 默认开;
      ScanConvMode 由 CubeMX 按 NbrOfConversion 自己推导,.ioc 里不保留该行。
    - 中断:interrupt 默认 false;写 interrupt=true → 注入 NVIC.ADC1_2_IRQn(ADC1/ADC2 共用向量),
      generate 后 stm32f1xx_it.c 里出现 ADC1_2_IRQHandler。
    - trigger 取值:写 CubeMX 枚举名或它的简写(工具自动补 ADC_EXTERNALTRIGCONV_ 前缀,
      如 T3_TRGO → ADC_EXTERNALTRIGCONV_T3_TRGO)。F103 可用:SOFTWARE_START(默认,软件启动)、
      EXT_IT11、T1_CC1、T1_CC2、T1_CC3、T2_CC2、T2_CC3、T3_CC1、T3_TRGO、T4_CC4、
      T5_CC1、T5_CC3、T8_TRGO、T8_CC1(完整列表即 knowledge/ip 里 ExternalTrigConv 的
      values)。**写错的值会被工具直接拦下并列出合法取值** —— CubeMX 自己对不认识的枚举
      是静默忽略,不会报错。
      注意**规则组和注入组的触发源不是一回事**:上面是规则组 `ExternalTrigConv`;
      `T1_TRGO` / `T2_TRGO` 这类只属于**注入组** `ExternalTrigInjecConv`(要用注入组才配它)。
      **常用配对(照抄即可)**:TIM3 当触发源 → ADC 写 `trigger="T3_TRGO"`,TIM3 侧配
      `TIM_MasterOutputTrigger=TIM_TRGO_UPDATE`(见 topic="tim");想用 TIM2 的 TRGO **不行**
      (规则组没有 T2_TRGO),要 TIM2 就用它的比较事件 `T2_CC2` / `T2_CC3`。
    - **外部触发(trigger)有坑**:只设 ADC 的 ExternalTrigConv、不给触发源外设配 TRGO 输出,
      generate 会卡死到超时;要用触发先把 TIM 配好(MasterConfig/TRGO)。
    - 注入通道 / 模拟看门狗(实测 2026-10-15,验证到落盘):`EnableInjectedConversion` /
      `InjectedConvMode` / `EnableAnalogWatchDog` 生效;`WatchdogMode` / `WatchdogChannel` 还没落盘。
    - DMA 搬运:在同一个意图里加 dma 字段(如 {"peripheral": "ADC1", "pins": ["PA0"], "dma":
      {"mode": "circular"}}),见 cubemx_help(topic="dma");配 DMA 时 ADC 时钟仍必须先配。
  can: |-
    【CAN(探针实测 2026-10-10)】
    - 命令:set mode CAN CAN_Activate;set pin PA11 CAN_RX / set pin PA12 CAN_TX
    - 实例名是 CAN(不是 CAN1):STM32F103C8T6 只有一个 bxCAN。
    - 默认波特率算出来是 749999 bit/s。
  rtc: |-
    【RTC(探针实测 2026-10-10)】
    - 命令:set mode RTC RTC_Enabled;需要日历时再叠加 set mode RTC RTC_Calendar
    - 用虚拟引脚(VP_RTC_VS_RTC_Activate / VP_RTC_VS_RTC_Calendar)表达。
    - 用 LSE 时 PC14/PC15 会被占用(OSC32_IN/OSC32_OUT),先和别的用途协调。
  iwdg: |-
    【IWDG(独立看门狗,探针实测 2026-10-10)】
    - 命令:set mode IWDG IWDG_Activate
    - 不需要引脚,写的是虚拟引脚 VP_IWDG_VS_IWDG。
  wwdg: |-
    【WWDG(窗口看门狗,探针实测 2026-10-10)】
    - 命令:set mode WWDG WWDG_Activate
    - 同上,写的是虚拟引脚 VP_WWDG_VS_WWDG。
  dma: |-
    【DMA(实测 2026-10-12:脚本 set 不行,但注入 .ioc 键组可用)】
    - 脚本 set 配不了(`set mode DMA ...` 一律 KO),但注入键组有效 —— 等价于 GUI 里
      在对应外设的 DMA Settings 点 Add。cubemx_intent 已封装,写在外设意图下:
        {"peripheral": "ADC1", "pins": ["PA0", "PA1"], "dma": {"mode": "circular"}}
        {"peripheral": "USART2", "pins": ["PA2", "PA3"], "dma": {"request": "USART2_RX"}}
    - 请求名来自 CubeMX db(DMA_Request 组):ADC1 / USART2_RX / SPI1_TX / TIM2_UP ...
      实例名本身就是请求名时可省略 request(ADC1、TIM2 这种);USART2 有 RX/TX 两个,
      必须显式写 dma.request(有歧义就报错,不替你选)。
    - 通道由 db 导出的表查出(knowledge/mcu/<芯片>.dma.yaml,如 ADC1→DMA1_Channel1、
      USART2_RX→DMA1_Channel6),不用自己填;要指定就写 dma.channel。
    - 其它字段(默认值而非强制):direction / mode(normal/circular) / periph_inc / mem_inc /
      periph_align / mem_align / priority / interrupt。
      **interrupt 默认 true**:不写就注入通道中断(`NVIC.<通道>_IRQn`,generate 后 it.c 里出现
      `<通道>_IRQHandler`)—— 与 CubeMX GUI 里加 DMA 请求的默认行为一致;只有写
      `"interrupt": false` 才不注入(只搬数据、不要中断回调时用)。
    - **别把两种中断搞混**:这里的 `interrupt` 只管 **DMA 通道中断**;外设自己的中断
      (如 `USART2_IRQn`)由外设意图的 `interrupt` 字段控制,两者互不影响。
      例:"USART2 只要 DMA、不要收发中断" → 外设意图**不写** `interrupt`,DMA 字段按默认
      (通道中断会开,生成 `DMA1_ChannelX_IRQHandler`)。
    - **模式建议**:串口/SPI 收数据一般显式写 `"mode": "circular"`(缓冲循环用);不写时
      CubeMX 按请求类型给默认 —— **UART 接收的默认是 `DMA_NORMAL`(只搬一次)**,
      ADC 循环采样一般也显式写 circular。
    - 数据宽度不用管:CubeMX 按请求类型补默认(ADC→HALFWORD、USART→BYTE,实测)。
      generate 后 dma.c 的 MX_DMA_Init、各外设 x.c 的 hdma_xxx + __HAL_LINKDMA、
      stm32f1xx_it.c 的 <通道>_IRQHandler 都会生成(实测三例:ADC1 / USART2_RX / RX+TX)。
    - 注意:配 ADC + DMA 时 ADC 时钟照样要先配(ADCPresc),否则 generate 弹 [Clock] 卡死。
    - 细节与实测记录见 knowledge/rules/dma.yaml。
  nvic: |-
    【中断(探针实测 2026-10-10)】
    - 脚本 set 配不了(CubeMX 命令表里没有中断相关项),但注入 .ioc 键有效:
      NVIC.USART2_IRQn=true\\:0\\:0\\:false\\:false\\:true\\:true\\:true\\:true
    - 实测:注入后 generate,Core/Src/stm32f1xx_it.c 里会出现对应的 <IRQ>Handler。
    - 用 cubemx_intent 时写成 {"interrupt": true}(用 {实例}_IRQn)或直接给中断名(如 I2C1_EV_IRQn)。
    - `.ioc` 里**只写已使能**的中断 ⇒ cubemx_load 摘要的 `nvic` 段里**没有**某个 IRQn,就说明它没开
      (例如没有 `TIM3_IRQn` ⇒ 不会生成 `TIM3_IRQHandler`)。摘要里恒出现的 BusFault/HardFault/
      SysTick 等是模板自带的。
remove: |-
  【移除外设(cubemx_remove_peripheral)】
  - 用法:cubemx_remove_peripheral(ioc, peripheral)
    如 cubemx_remove_peripheral("C:/proj/Demo.ioc", "TIM3")
  - 直接编辑 .ioc 文本(脚本 set noparam 对部分外设无效):删除 Mcu.IPx、
    关联引脚/参数、NVIC、functionlistsort 段,并重排序号。
  - 注意:操作前自行备份;移除后建议重新 generate 同步代码。
