# NVIC(中断):脚本 set 命令配不了,但**直接注入 .ioc 键有效**(实测)
#
# 实测(2026-10-10,CubeMX 6.18.0):
#   ① 脚本写法 —— 下面三种都**没有**写进 .ioc(set 命令这条路不通):
#        set ip parameters NVIC USART2_IRQn true:0:0:false:false:true:true:true:true
#        set ip parameters NVIC USART2_IRQn true
#        set ip parameters NVIC IRQn USART2_IRQn
#   ② 注入写法 —— 手工往 .ioc 里插一行
#        NVIC.USART2_IRQn=true\:0\:0\:false\:false\:true\:true\:true\:true
#      再 load + generate,生成的 Core/Src/stm32f1xx_it.c 里**出现了 USART2_IRQHandler**。
# 结论:中断走"注入 .ioc 键"这条路(和 TIM 的 NVIC 是同一个写法)。
verified: true
source: "探针实测 2026-10-10,CubeMX 6.18.0(注入后 generate,it.c 里出现 USART2_IRQHandler)"

ioc_key:
  pattern: 'NVIC.{irq}=true\:0\:0\:false\:false\:true\:true\:true\:true'
  example: 'NVIC.USART2_IRQn=true\:0\:0\:false\:false\:true\:true\:true\:true'
  verified_by: "generate 之后 Core/Src/stm32f1xx_it.c 里有对应的 <IRQ>Handler"

irq_naming:
  note: "USART2 -> USART2_IRQn、TIM2 -> TIM2_IRQn 这种最直白;但不是所有外设都这么简单(I2C 有 _EV / _ER 两个中断)"
  how_to: "拿不准就显式给中断名;我们只在实测过的形态上放行"

set_command_not_supported:
  tried:
    - "set ip parameters NVIC USART2_IRQn true:0:0:false:false:true:true:true:true -> 没写进 .ioc"
    - "set ip parameters NVIC USART2_IRQn true -> 没写进 .ioc"
    - "set ip parameters NVIC IRQn USART2_IRQn -> 没写进 .ioc"
  note: "CubeMX 的 help 命令表里也没有中断相关子命令"
