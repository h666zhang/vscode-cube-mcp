# RTC:已用探针实测(CubeMX 6.18.0,STM32F103C8T6)
#
# 实测:set mode RTC RTC_Enabled -> 写 VP_RTC_VS_RTC_Activate 两行;
#       再叠加 set mode RTC RTC_Calendar -> 又写 VP_RTC_VS_RTC_Calendar 两行。
# 也是虚拟引脚(VP_)表达,和 IWDG / WWDG 一个套路。
verified: true
source: "探针实测 2026-10-10,CubeMX 6.18.0"

modes:
  enabled: RTC_Enabled
  calendar: RTC_Calendar
  enabled_calendar: [RTC_Enabled, RTC_Calendar]

command_examples:
  - "set mode RTC RTC_Enabled"
  - "set mode RTC RTC_Calendar"

ioc_result:
  - "VP_RTC_VS_RTC_Activate.Mode=RTC_Enabled"
  - "VP_RTC_VS_RTC_Activate.Signal=RTC_VS_RTC_Activate"
  - "VP_RTC_VS_RTC_Calendar.Mode=RTC_Calendar"
  - "VP_RTC_VS_RTC_Calendar.Signal=RTC_VS_RTC_Calendar"

known_issues:
  - "**有顺序依赖(实测 2026-10-15)**:`set mode RTC RTC_Calendar` 单独发会返回 KO —— 必须先
    `set mode RTC RTC_Enabled`。叠加就是按 Enabled -> Calendar 的顺序发两条(意图里写 mode=enabled_calendar)"
  - "激活生效的标志是 `Mcu.IPx=RTC` 加两对虚拟引脚行 `VP_RTC_VS_RTC_Activate.*` / `VP_RTC_VS_RTC_Calendar.*`;
    只 grep `RTC.` 开头的行会以为没生效(2026-10-15 实测踩过这个误判)"
  - "日历参数 `set ip parameters RTC AsynchPrediv 32767` 实测生效(落盘 RTC.AsynchPrediv);
    时间/日期(date / time)与 AutoPrediv 的具体写法还没探明"
  - "**时钟源(LSE/LSI)的写法还没探明**:`set ip parameters RCC RTCClockSelection RCC_RTCCLKSOURCE_LSE`
    实测没写出对应的 RCC 行(键名可能不是这个);要用 LSE 先在 GUI 里配一次再回读 .ioc"
  - "用 LSE 时 PC14/PC15 会被占用(OSC32_IN/OSC32_OUT),要先和别的用途协调"

parameters_from_db:
  asynch_prediv:
    key: "RTC.AsynchPrediv"
  auto_prediv:
    key: "RTC.AutoPrediv"
