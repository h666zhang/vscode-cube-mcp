# DMA:三种路径都试过,**都不行** —— 需要 DMA 就先用 CubeMX GUI 配一次
#
# 实测(2026-10-10,CubeMX 6.18.0):
#   ① 脚本 set mode(两种写法都 KO):
#        set mode DMA SPI1_RX     -> KO
#        set mode DMA DMA1        -> KO
#   ② 命令表核对:`cubemx_script("help")` 列出的 set 子命令里**没有任何 DMA 相关项**
#      (只有 mode / username / pin / pinreservation / gpio / ip / AllIpInContext /
#        context* / noparam / userconst / bsp / tpl_path / dest_path)
#   ③ 注入 .ioc 键(只写请求、不给通道):
#        Dma.Request0=SPI1_RX
#        Dma.RequestsNb=1
#      -> config load 返回 OK,但 config saveas 时 CubeMX 把这两行**丢掉了**
#         (归一化后一行 Dma.* 都不剩),也没有自己补通道。
#
# 顺带查过:通道映射不在 db 里 —— db/mcu/config/DMA-STM32F1xx_Configs.xml 只有 HAL 函数定义
# (HAL_DMA_Init / HAL_DMA_DeInit / REMAP_*),没有"SPI1_RX 用哪个通道"的对应关系。
#
# 结论:脚本和注入都不行。要用 DMA,请先用 CubeMX GUI 给外设 Add 一次 DMA,
#       然后在此基础上继续用其它工具(工具不会去动已有的 DMA 配置)。
