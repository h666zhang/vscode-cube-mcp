# ADC:已用探针实测(CubeMX 6.18.0,STM32F103C8T6)
#
# 第一轮实测:在 templates/STM32F103C8T6.ioc 的副本上(基线只读)跑
#     set mode ADC1 IN0
#     set pin PA0-WKUP ADC1_IN0
# 结果是下面 ioc_result(探针差异:新增 12 行 / 修改 9 行)。
#
# 第二轮实测(ADCTest 工程):采样时间与 ADC 时钟分频 —— 两者都实测过,
# 其中时钟分频是 generate 能否通过的必要条件(见 known_issues 第 1 条)。
#
# 第三轮实测(ADCTest2 工程副本,探针):多通道序列 / 连续转换 / 扫描模式 / 外部触发。
# 第四轮(ADCTest3 工程,generate 回读):双通道+连续+EOC 中断全部生效;外部触发
# 无配套 TIM2 TRGO 时会卡死(generate 超时),见 known_issues。
verified: true
source: "探针实测 + generate 回读验证 2026-10-10,CubeMX 6.18.0"

command_examples:
  - "set mode ADC1 IN0"
  - "set pin PA0-WKUP ADC1_IN0"
  - "set ip parameters ADC1 SamplingTime-0#ChannelRegularConversion ADC_SAMPLETIME_55CYCLES_5"
  - "set ip parameters RCC ADCPresc RCC_ADCPCLK2_DIV6"
  # 多通道:第 2 个通道起必须显式补序列(set mode INn 只挂引脚,不会写 Rank-n)
  - "set ip parameters ADC1 NbrOfConversion 2"
  - "set ip parameters ADC1 Rank-1#ChannelRegularConversion 2"
  - "set ip parameters ADC1 Channel-1#ChannelRegularConversion ADC_CHANNEL_1"
  - "set ip parameters ADC1 SamplingTime-1#ChannelRegularConversion ADC_SAMPLETIME_55CYCLES_5"
  # 连续转换 / 扫描模式 / 外部触发
  - "set ip parameters ADC1 ContinuousConvMode ENABLE"
  - "set ip parameters ADC1 ScanConvMode ADC_SCAN_ENABLE"
  - "set ip parameters ADC1 ExternalTrigConv ADC_EXTERNALTRIGCONV_T3_TRGO"

ioc_result:
  - "PA0-WKUP.Locked=true"
  - "PA0-WKUP.Signal=ADCx_IN0"
  - "SH.ADCx_IN0.0=ADC1_IN0,IN0"
  - "SH.ADCx_IN0.ConfNb=1"
  - "ADC1.master=1"
  - "ADC1.NbrOfConversionFlag=1"
  - "ADC1.Rank-0\\#ChannelRegularConversion=1"
  - "ADC1.Channel-0\\#ChannelRegularConversion=ADC_CHANNEL_0"
  - "ADC1.SamplingTime-0\\#ChannelRegularConversion=ADC_SAMPLETIME_1CYCLE_5"
  - "ADC1.IPParameters=Rank-0\\#ChannelRegularConversion,Channel-0\\#ChannelRegularConversion,SamplingTime-0\\#ChannelRegularConversion,NbrOfConversionFlag,master"

# 采样时间:意图字段 sampling_time 用这个模板渲染(命令已实测)
sampling_time:
  command: "set ip parameters {instance} SamplingTime-0#ChannelRegularConversion {value}"
  example_value: ADC_SAMPLETIME_55CYCLES_5
  # 55.5 周期 @12MHz ADCCLK ≈ 4.6us,等于标准外设库的 ADC_SampleTime_55Cycles5

# ADC 时钟:配 ADC 时必须同时设预分频,否则 CubeMX 判定时钟参数非法,
# generate 时弹 "Warning: Code Generation ... [Clock]" 对话框 → -q 下没人点 → 卡到超时。
clock:
  set_ip: RCC
  parameter: ADCPresc
  max_hz: 14000000                    # STM32F103 的 ADCCLK 上限 14MHz(参考手册)
  pclk2_key: "RCC.APB2Freq_Value"     # 从 .ioc 读 PCLK2(ADC 挂在 APB2)
  pclk2_default_hz: 72000000          # 读不到时按最小模板的 72MHz 估算
  prescalers:                         # 取值 -> 相对 PCLK2 的分频比
    RCC_ADCPCLK2_DIV2: 2
    RCC_ADCPCLK2_DIV4: 4
    RCC_ADCPCLK2_DIV6: 6
    RCC_ADCPCLK2_DIV8: 8

# 中断:F103 上 ADC1/ADC2 共用一个中断向量,脚本配不了,靠注入 NVIC 键(见 rules/nvic.yaml)。
# cubemx_intent 里写 {"interrupt": true} 时用的就是这个中断名。
interrupt_irq: ADC1_2_IRQn

# 移除该外设(cubemx_remove_peripheral)时要连带清理的引脚信号模式:
# ADC 的引脚信号名是 ADCx_IN0(带 x,里面没有 "ADC1"),光靠"信号里含实例名"认不出来,
# 所以在这里明确给出模式。
remove:
  pin_signal_patterns: ["ADCx_IN"]

# 外部触发:意图里可写简写(如 T2_TRGO),补成 ADC_EXTERNALTRIGCONV_T2_TRGO
trigger_prefix: ADC_EXTERNALTRIGCONV_

# 离线预检用:这个值是"不用外部触发"(有它就别去要求触发源的 TRGO)
software_start: ADC_SOFTWARE_START

known_issues:
  - "引脚侧信号名是 ADCx_IN0(带 x 占位符,是 CubeMX 自己写的),但 set pin 命令里要写 ADC1_IN0"
  - "模式名是通道号:IN0 / IN1 / ...(PA0-WKUP->IN0、PA1->IN1、PA5->IN5)"
  - "ADC 的键名里 # 要转义成 \\#(如 Channel-0\\#ChannelRegularConversion);但 set ip parameters 命令里直接写 # 即可"
  - "默认采样时间 ADC_SAMPLETIME_1CYCLE_5;改采样时间用 set ip parameters ADC1 SamplingTime-0#ChannelRegularConversion <枚举>(实测有效)"
  - "**必须同时配 ADC 时钟**:72MHz PCLK2 下要用 RCC_ADCPCLK2_DIV6(12MHz ≤ 14MHz 上限)。不配时 generate 会弹 'Warning: Code Generation ... [Clock]' 对话框,-q 批处理没人点 → 进程卡死到 240s 超时(实测);被强杀的 CubeMX 进程还会残留,需手动 taskkill"
  - "RCC.ADCFreqValue 由 CubeMX 在 generate 时重算:load/saveas 阶段即使设了 ADCPresc 也不会立刻变成 12000000,别当成命令没生效"
  - "顺序:先 set mode / set pin 激活外设,再 set ip parameters 改参数;外设未激活时 set ip parameters 会被静默忽略"
  - "所有外设生成 MHZ 时钟树自洽后 generate 才会静默通过;判定标准是 GUI 里 Main Config 没有标红的 [Clock]"
  - "多通道(实测):set mode ADC1 IN1 + set pin PA1 ADC1_IN1 只把引脚挂上,**不会**写出 Rank-1 序列;必须再补 NbrOfConversion + 每个通道一组 Rank-n#ChannelRegularConversion / Channel-n#ChannelRegularConversion / SamplingTime-n#ChannelRegularConversion"
  - "连续转换 ContinuousConvMode ENABLE、扫描 ScanConvMode ADC_SCAN_ENABLE 均实测写入成功(取名:scan 用 ADC_SCAN_ENABLE,continuous 用 ENABLE)"
  - "generate 回读验证(ADCTest3,双通道+连续+中断):adc.c 里 NbrOfConversion=2、ScanConvMode=ADC_SCAN_ENABLE、ContinuousConvMode=ENABLE;两次 HAL_ADC_ConfigChannel 分别配 ADC_CHANNEL_0 / ADC_CHANNEL_1;注入 NVIC.ADC1_2_IRQn 后 stm32f1xx_it.c 里出现 ADC1_2_IRQHandler 并调 HAL_ADC_IRQHandler"
  - "ScanConvMode 不必手写:.ioc 里不保留这一行(saveas 时被清理),但 CubeMX 在 NbrOfConversion>1 时会自动生成 ADC_SCAN_ENABLE —— 写了也没坏处,只是冗余"
  - "**外部触发必须配套触发源**:只把 ExternalTrigConv 设成 ADC_EXTERNALTRIGCONV_T3_TRGO、而 TIM3 没配 TRGO 输出时,generate 会卡死到 240s 超时(实测)。要用外部触发,先用 TIM 把触发源配好(MasterConfig/TRGO),再设 ADC 的 ExternalTrigConv"
  - "触发源要分清规则组/注入组:F103 规则组(ExternalTrigConv)的合法取值里**没有 T2_TRGO** —— 那是注入组 ExternalTrigInjecConv 的值(ADC_EXTERNALTRIGINJECCONV_T2_TRGO);规则组要用 TIM2 只能写 T2_CC2 / T2_CC3,要 TRGO 得用 T3_TRGO / T8_TRGO。写非法值时 CubeMX 静默忽略(不报错,硬件永不转换);cubemx_intent 现在对照 db 导出的 values 直接拦下并列出合法取值"
  - "db 导出的 NbrOfConversion 写着 max: '1',那是 XML 里 Visible=false 的那份定义;真正可见的定义是 Max=16,实测能设 2 —— 别被 parameters_from_db 的 max 误导"
  - "中断:注入 NVIC.ADC1_2_IRQn(ADC1/ADC2 共用向量),generate 后 stm32f1xx_it.c 里出现 ADC1_2_IRQHandler"
  - "还没实测:注入通道(InjectedConv)、模拟看门狗"
  - "DMA 搬运已支持(见 rules/dma.yaml):在意图里加 dma 字段即可;配了 DMA 之后 ADC 时钟仍必须先配好,否则 generate 卡死"

parameters_from_db:
  sampling_time:
    key: "ADC{n}.SamplingTime-0\\#ChannelRegularConversion"
    default: ADC_SAMPLETIME_1CYCLE_5
